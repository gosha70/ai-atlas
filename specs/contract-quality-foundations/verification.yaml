# Contract: shared/schemas/verification.schema.json
status: finalized
feature_id: contract-quality-foundations

FR-001:
  statement: "For every method the processor exposes on the API channel and that is active at the configured `ai.atlas.api.major`, the generated OpenAPI document MUST contain exactly one operation, under the same path and HTTP method as the generated controller's mapping: path `{apiBasePath}/v{major}/{kebab-case service}/{kebab-case method}`, `GET` when the method takes no arguments and `POST` when it takes any. Operations that share a path MUST be merged into that path's single path item, each under its own HTTP method, so no operation replaces another. The document MUST contain no operation without a corresponding controller mapping."
  statement_sha: "sha256:21920d61d5a3c6ae66715fa7e967d8d5656e6763ab59ed32f690ed3047c67095"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest'"
FR-002:
  statement: "Two methods exposed on the API channel and active at the configured major, anywhere in the compilation, that map to the same HTTP method and path MUST be a compile ERROR, reported on each such method element and naming the path, the HTTP method and the other declaration(s) as `fully.qualified.ServiceClass#method`. This covers two overloads of one service that both take arguments, and two services with the same simple name in different packages (paths use the simple name). The generated controllers would otherwise fail at application startup with an ambiguous mapping."
  statement_sha: "sha256:28f576f97e38828b76898bf2e1ad6ffbc043f03d4e818f08cd1fefaa985eb616"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest'"
FR-003:
  statement: "Query parameters are the canonical representation of method arguments. The generated controller MUST keep binding each argument with `@RequestParam` (unchanged), and the OpenAPI operation MUST describe each argument as a `parameters` entry with `in: query`, the argument's name, its schema (the existing Java-type mapping), its description when one is declared, and `required: true` (matching `@RequestParam`'s default). The operation MUST NOT declare a `requestBody`."
  statement_sha: "sha256:0fc9bda7dd74d1f6f0d5dd8ec68a428d28d15097a0664747178e3b6955d93924"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest' --tests '*OpenApiGeneratorTest'"
FR-004:
  statement: "Every `operationId` in the generated OpenAPI document MUST be unique, assigned in two passes. First, every operation whose method name is used by no other operation in the document keeps the method name as its `operationId` (unchanged), and these IDs are reserved. Then the remaining operations, taken in ascending order of (path, lower-case HTTP method), each get the candidate `{ServiceSimpleName}_{methodName}_{httpMethod}` (lower-case HTTP method, for example `OrderService_find_get`); if that candidate is already reserved or assigned, it gets the candidate followed by `_2`, `_3`, … — the smallest suffix not yet taken. Each assigned ID is then reserved. The same input MUST always yield the same IDs."
  statement_sha: "sha256:517acb6c531fd7a1b3cdbde6d332313e0e44847176cad590123bb760374e6012"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest'"
FR-005:
  statement: "Every generated OpenAPI operation MUST declare response status `200`, with content matching what the generated controller returns: for a generated DTO, `application/json` with the DTO schema reference (an array of it for collection, iterable and array returns); for `void`, no content; for `String`, `text/plain` with a string schema; for a boxed or primitive number or boolean, `application/json` with the mapped scalar schema; for a collection or array of those, `application/json` with an array of the mapped scalar schema; for any other type, `application/json` with an object schema."
  statement_sha: "sha256:ac0e507be68d45ac735c3ebc6ce53ab0ecab5c705af876589b5f48db4e49587b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest'"
FR-006:
  statement: "A `void` service method exposed on any channel MUST produce generated code that compiles: the generated REST controller method and the generated MCP tool method MUST be `void` and call the service without returning its result. This is the only change to the generated controllers and tools in Phase 0; non-`void` methods are generated byte-identically to before."
  statement_sha: "sha256:be0cec264a19be6b5e12add6ee1844a0f9d2cd15db4afa1ee69e1325a608ac85"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest' --tests '*AtlasGeneratorGoldenTest' --tests '*RestControllerGeneratorTest' --tests '*McpToolGeneratorTest'"
FR-007:
  statement: "Consistency MUST be tested in both directions and at both levels. (a) A processor compile-testing golden test MUST compile representative services and pin each generated controller mapping beside its OpenAPI operation, covering: no arguments; one scalar argument; several arguments; a DTO return; a collection return; a non-DTO return; a `void` method on the API channel and on the default channels (the fixture compiles); and an API-only service declaring `find()` and `find(Long id)`, whose document holds both the `GET` and `POST` operations under the one shared path with distinct `operationId`s; that same `find()` / `find(Long id)` service beside another API-only service declaring a uniquely named `OrderService_find_get()`, which keeps `OrderService_find_get` while the overloaded `GET` gets `OrderService_find_get_2`, with every `operationId` in the document distinct; two overloads on one POST path, and two same-named services in different packages, each a compile ERROR at every site (FR-002). It MUST also assert that the set of (HTTP method, path) pairs mapped by the generated controllers equals the set of operations in the document. (b) A demo integration test MUST read the generated `openapi-v{major}.json` from the demo's classpath, assert that every request mapping of every generated controller in the running demo has a documented operation and every documented operation has a mapping, and call every documented operation (MockMvc) with each argument placed where the document says, asserting the documented status and a response `Content-Type` compatible with the documented media type."
  statement_sha: "sha256:0237cb59e6383f192b7292acbfc4bf6bd140fe2885405001f821d8b2232847ef"
  verifiers:
    - kind: deterministic
      test: "./gradlew :demo:test --tests '*OpenApiRuntimeConsistencyTest' && ./gradlew :modules:processor:test --tests '*RestOpenApiConsistencyTest'"
FR-008:
  statement: "The correction MUST be declared, not silent: `CHANGELOG.md` MUST gain, under `[Unreleased]`, an entry whose heading contains the text `REST parameters are query parameters`, stating that query parameters are canonical, that the REST wire format of running controllers is unchanged, that clients generated from an earlier OpenAPI document (which described a JSON request body) must be regenerated, that operations previously lost on shared paths now appear, and that duplicate method names now yield qualified `operationId`s. `docs/annotation-guide.md` and `docs/processor-internals.md`, where they describe the generated REST controller, MUST state that method arguments are query parameters in both the controller and the OpenAPI document."
  statement_sha: "sha256:893385c33335d91d5d9a742923d91a6e667c55e912382b30565702aab2838505"
  verifiers:
    - kind: deterministic
      test: "grep -q 'REST parameters are query parameters' CHANGELOG.md && grep -qi 'query parameter' docs/annotation-guide.md && grep -qi 'query parameter' docs/processor-internals.md"
FR-009:
  statement: "The processor MUST compute the effective MCP tool name (the method's explicit `toolName` when non-empty, else the method name) of every method exposed on the AI channel and active at the configured `ai.atlas.api.major`, across all services in the compilation, and MUST report a compile ERROR when two or more such methods share an effective name. Overloads of one method in one class count as a collision."
  statement_sha: "sha256:d0d3336754304e8df27240cadc74bc3182c9b885da225e70f2f079101aa02b7d"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolNameCollisionTest'"
FR-010:
  statement: "The collision ERROR MUST be reported on each conflicting method element, and each message MUST name the colliding tool name, list the other declaration(s) as `fully.qualified.ServiceClass#method`, and state that an explicit `toolName` on `@AgenticExposed` resolves it."
  statement_sha: "sha256:f927de2901dcf0943f3a1ace7a38bdf16bbb6d5d021ea1a1874841482f1e0216"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolNameCollisionTest'"
FR-011:
  statement: "Non-colliding effective tool names MUST be unchanged: the generated `@Tool(name = …)` of a method that does not collide is byte-identical to the output before this feature. Methods that are not on the AI channel, or not active at the configured major, MUST NOT take part in the collision check."
  statement_sha: "sha256:36fbbdda7a9c40c139843008d890550584880a33aae314a45bc788c4678093a0"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolNameCollisionTest' --tests '*AtlasGeneratorGoldenTest'"
FR-012:
  statement: "For every method exposed on the AI channel and active at the configured major whose own `@AgenticExposed` has no non-empty `description`, the processor MUST emit a WARNING on the method that names it as `fully.qualified.ServiceClass#method`, gives its effective tool name, and says which fallback was used (the class-level description, or `Invokes <method>`)."
  statement_sha: "sha256:cf4463461d5f0fc7b5f88f29ba61ad7fdd7c0e61d6ae2e7dd11804c363b876bb"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolDescriptionDiagnosticTest'"
FR-013:
  statement: "The processor MUST accept a new option `ai.atlas.strict` (`true` or `false`, case insensitive, default `false`), declared in `@SupportedOptions` and exposed by the Gradle plugin's `agentic { }` extension. When it is `true`, the FR-012 diagnostic MUST be reported as an ERROR instead of a WARNING. Any other value MUST be a compile ERROR that names the option and the value."
  statement_sha: "sha256:61cc45f0126225457e92e4da6344deb687f4ca0ad89f529db3a8cfaed65a8080"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolDescriptionDiagnosticTest' && ./gradlew :modules:gradle-plugin:functionalTest"
FR-014:
  statement: "Methods exposed only on the API channel MUST NOT produce the FR-012 diagnostic, and the generated MCP tool descriptions MUST keep carrying their version and deprecation guidance unchanged."
  statement_sha: "sha256:31c80da0a09b9f3d53538167057b2e174ab19c4b9943c925883775660b9d7f76"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ToolDescriptionDiagnosticTest' --tests '*McpToolGeneratorTest'"
FR-015:
  statement: "The demo module MUST compile with no ai-atlas WARNING: every AI-exposed demo method that lacks a method-level description (e.g. `OrderService.findByStatus`) gains one."
  statement_sha: "sha256:0e16a383f8acf2075423ba2a691522b90e648ac12848c87523e51552fa1369ef"
  verifiers:
    - kind: deterministic
      test: "scripts/check-demo-no-atlas-warnings.sh"
FR-016:
  statement: "With `spring.ai.mcp.server.protocol=STREAMABLE`, an application using the ai-atlas runtime MUST serve the Atlas-generated tools over MCP Streamable HTTP at Spring AI's streamable endpoint (default `/mcp`), and an MCP `tools/list` over that transport MUST return the same tool names as the SSE transport returns for the same application."
  statement_sha: "sha256:798caf3a4d88828545673f6216014c663185015c5884e201bae979e64937f679"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test --tests '*StreamableHttpTransportTest'"
FR-017:
  statement: "With no `spring.ai.mcp.server.protocol` set, the runtime MUST keep serving over SSE (`GET /sse`, `POST /mcp/message`) exactly as before; `SseUnchangedTest` MUST pass unmodified."
  statement_sha: "sha256:b1a64b2584969dfd6b6619aa35d62c9453ff594914b5438a494c005612e5ab5a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test --tests '*SseUnchangedTest'"
FR-018:
  statement: "`docs/harness-integration.md` MUST describe both HTTP transports, the property that selects one, that SSE is the default, and the Streamable HTTP endpoint; the demo's `application.yml` MUST show the property, commented out. The standalone STDIO server (`modules/mcp-stdio`) MUST be unchanged, with its tests passing."
  statement_sha: "sha256:828031622d31065cd8edd344a01807f9187efbaf52d56ab573753a65ba220de1"
  verifiers:
    - kind: deterministic
      test: "grep -q 'STREAMABLE' docs/harness-integration.md && grep -q 'protocol: STREAMABLE' demo/src/main/resources/application.yml && ./gradlew :modules:mcp-stdio:test"
FR-019:
  statement: "`./gradlew build` MUST pass with Gradle run on JDK 17 and, separately, on JDK 21 — the two legs of the CI matrix. The verifier MUST run both builds itself, each with `JAVA_HOME` set to that JDK, and MUST fail (not skip) when either JDK cannot be found."
  statement_sha: "sha256:e62a78e68a0c18d673c080aa27c21e14df79b77024796cd88a543d68121d9dcc"
  verifiers:
    - kind: deterministic
      test: "scripts/build-on-jdk-matrix.sh"
