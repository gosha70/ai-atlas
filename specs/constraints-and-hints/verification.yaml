# verification.yaml — requirement→verifier evidence graph (#190 §3).
# Generated by scripts/generate-verification-draft.sh — review each
# entry, replace every placeholder with a real executable verifier,
# then set status: finalized. spec.md is the only authoritative
# source of requirement text; statement below is display-only and
# statement_sha binds it (admission recomputes and fails on drift).
# Verifier kinds: deterministic (test: <path|command>),
#   runtime_conformance (criterion: judged against the RUNNING app),
#   visual (criterion: judged against the RENDERED app). Mapping any
#   FR to kind: visual is what puts UI IN SCOPE — admission then
#   requires the UI bundle (DESIGN.md, harness/, copilot:review).
# The visual placeholder below each FR is an author-decision
#   SCAFFOLD, not a claim that the FR is UI-visible: write a
#   concrete criterion if it is, otherwise REMOVE the verifier.
#   Leaving it unresolved keeps the artifact inadmissible.
# Contract: shared/schemas/verification.schema.json
status: draft
feature_id: constraints-and-hints

FR-001:
  statement: "The `annotations` module MUST gain two annotations, and keep zero dependencies: - `@AgenticParam`, targeting method parameters. It has `description` (default `\"\"`) and `required`, of a new enum `Requiredness { DEFAULT, REQUIRED, OPTIONAL }`, default `DEFAULT`. - `@AgenticConstraints`, targeting fields and method parameters, with these attributes. Each has a default that means \"not set\". - `minimum` and `maximum`: decimal strings, default `\"\"`; - `exclusiveMinimum` and `exclusiveMaximum`: booleans, default `false`; - `minLength`, `maxLength`, `minItems` and `maxItems`: ints, default `-1`; - `pattern`: a string, default `\"\"`."
  statement_sha: "sha256:54c2a020e4f6be1be1ca96ff36d03312ded4a48b71f87eb2489a3a34beb16dfb"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-002:
  statement: "The processor MUST read Jakarta Bean Validation annotations on `@AgenticField` fields and on the parameters of exposed methods. It identifies them by qualified name, with no compile-time dependency on the validation API, and normalises them as follows: - `@Min`/`@DecimalMin` become `minimum`, and `@Max`/`@DecimalMax` become `maximum`. A `@DecimalMin`/`@DecimalMax` with `inclusive = false` sets `exclusiveMinimum`/`exclusiveMaximum`. - `@Positive` is `minimum 0` with `exclusiveMinimum`; `@PositiveOrZero` is `minimum 0`. - `@Negative` is `maximum 0` with `exclusiveMaximum`; `@NegativeOrZero` is `maximum 0`. - `@Size` becomes `minLength`/`maxLength` on a `String`, and `minItems`/`maxItems` on a collection or array. Its default bounds (`0` and `Integer.MAX_VALUE`) are not recorded. - `@Pattern` becomes `pattern`. - `@NotNull` makes the input required. `@NotBlank` makes it required with `minLength 1` and `pattern \".*\\S.*\"`. `@NotEmpty` makes it required with `minLength 1` (a string) or `minItems 1` (a collection or array). - Other constraint annotations, including composed ones, are ignored."
  statement_sha: "sha256:21df0b91833903c96ce377442d0c53ef2cfa7bf8c652c9d6ec965fcaf3015e8a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-003:
  statement: "The effective contract of an input or field MUST be resolved per constraint key: - `@AgenticConstraints` replaces only the keys it sets, and every other Bean Validation key still applies. - Requiredness comes from `@AgenticParam(required)` when it is not `DEFAULT`; `@AgenticParam(description)`, when non-empty, becomes the parameter's description. - Otherwise a parameter is required when it is a primitive, or carries `@NotNull`, `@NotBlank` or `@NotEmpty`. - Otherwise it is required, as REST query parameters are today."
  statement_sha: "sha256:9992e24b62564815b992c02f4d99260f107e375bcf47d196f7342daa712398f9"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-004:
  statement: "The processor MUST report: - A compile ERROR on the element for a self-contradiction: - `minimum > maximum`, or equal bounds with either exclusive; - a negative length or item bound, or a `min` above its `max`; - a `pattern` that does not compile as a Java regex; - an exclusive flag without its bound; - a length attribute on a non-string, or an item attribute on a non-collection, non-array; - `minimum`/`maximum` on a non-numeric type; - `Requiredness.OPTIONAL` on a primitive, or together with `@NotNull`, `@NotBlank` or `@NotEmpty`. - A WARNING on the parameter when an `@AgenticConstraints` value on an *input* is looser than the Bean Validation constraint it replaces, naming the key and both values. Looser means a lower minimum, a higher maximum, a wider length or item range, or a removed pattern."
  statement_sha: "sha256:f8b4ac725640e203e9ad30a5f243c29d887b0749d9daaf6e76e7cf49d6e64a87"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-005:
  statement: "The Contract IR MUST move to `irVersion` 2: - `Field` gains `constraints`. - `Parameter` gains `constraints` and `required` (boolean). - `Operation` gains `hints`, with `readOnly`, `destructive`, `idempotent` and `openWorld`, each `true`, `false` or absent. - `constraints` is an object with only the keys that are set, in the fixed order `minimum`, `exclusiveMinimum`, `maximum`, `exclusiveMaximum`, `minLength`, `maxLength`, `minItems`, `maxItems`, `pattern`. - Output stays deterministic under Phase 2's FR-003 rules. - The IR records constraints and hints whether or not the flag is on."
  statement_sha: "sha256:947bdbdfd73f944ca6f0bbd4d11310de2e5029d83843fe35865ee3ba432f4a68"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrVersion2Test'"
FR-006:
  statement: "Reading a baseline MUST accept `irVersion` 1 and 2: - A version-1 document is migrated in memory, with every `constraints`, `required` and `hints` value *unknown*: JSON `null` in the model, distinct from an empty object. - `irVersion` above 2 stays an error, as in Phase 2's FR-004. - A version-2 document with a missing or `null` constraint slot is malformed."
  statement_sha: "sha256:41e444b61aa9fd59f6f8cf06bae6c46d54304b12a3ec83034c1e4e3f19dc9b6a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrVersion2Test'"
FR-007:
  statement: "The demo's committed baseline `demo/.atlas/api.ir.json` MUST be regenerated as `irVersion` 2 in the same change that moves the IR to version 2. Phase 2's `ContractBaselineTest` MUST stay green."
  statement_sha: "sha256:6b43ae3b0656a01a94255fa77b2b643861c421a82dbca3c94b94c7ebed987d25"
  verifiers:
    - kind: deterministic
      test: "./gradlew :demo:test --tests '*ContractBaselineTest'"
FR-008:
  statement: "For inputs (operation parameters), compared at the baseline's published major: - Breaking: - a parameter's `required` goes from `false` to `true`; - a new key is set; - `minimum` rises, `maximum` falls, or either becomes exclusive; - `minLength` or `minItems` rises; - `maxLength` or `maxItems` falls; - `pattern` is added or changed. - Compatible: the reverse of each of these. - Never a difference: any change from an *unknown* baseline value."
  statement_sha: "sha256:fb2dce76a73be3c113d163c0d2b6514e943aed10b289922923910e6ddc90aa6b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-009:
  statement: "Differences in output constraints (entity fields) and in hints MUST be classified as `informational`. They appear in `contract-diff.json` and produce no diagnostic, except in lock mode."
  statement_sha: "sha256:27cec8824756fac5a9cd4e70d9087130687e1254fca2fd2b103aa2217e5a0b63"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-010:
  statement: "In lock mode, every constraint, requiredness and hint difference is a difference, except a change from an *unknown* baseline value. So upgrading ai-atlas does not fail a locked project that has not yet accepted a version-2 baseline."
  statement_sha: "sha256:e0007f5a17b83fcc671c8f1a5d892af8a2dd072c59cd0fe544a652bc54b22324"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-011:
  statement: "Each breaking constraint diagnostic MUST name: - the path `parameter <qualified class>#<method>(<parameter types>).<name>`; - the constraint key, as before → after; - that it narrows an input for clients of major M; - the legitimising declaration: a replacement operation with `apiSince = <M+1>`, or accepting the change with `atlasAccept`."
  statement_sha: "sha256:f30bba4b0bafee46564892fdc875a0792ce9819e5c2d2e9b9401a86afed8aa9f"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-012:
  statement: "The processor MUST accept the option `ai.atlas.constraints`: `true` or `false`, case-insensitive, default `false`. Any other value is a compile ERROR naming the option and the value. With the option `false`, every generated source and resource MUST be byte-identical to before this feature, except the IR files, which the golden snapshot excludes. The golden snapshot test proves this."
  statement_sha: "sha256:02e31c241872fafca794fbf4b8e76f4e81ef4736666c0bd8716404abbe207ecc"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrRewireGoldenTest'"
FR-013:
  statement: "`@AgenticExposed` MUST gain `readOnly`, `destructive`, `idempotent` and `openWorld`, of a new enum `Hint { UNSET, TRUE, FALSE }`, each default `UNSET`. - A method-level value other than `UNSET` overrides the class-level one. - Nothing is inferred from method names, parameters or HTTP method. - With the flag on, an AI-channel method whose four resolved hints are all `UNSET` gets a WARNING naming the method, which becomes an ERROR under `ai.atlas.strict`."
  statement_sha: "sha256:3f0caba30f1de891f73e7ea5a1980bf5a7e16f41aea64aa38047ac5bd468613a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-014:
  statement: "With the flag on, the OpenAPI document MUST describe: - each query parameter's `required` from FR-003, and its constraints as JSON-Schema keywords on the parameter schema; - each DTO property's field constraints on the component schema."
  statement_sha: "sha256:a940f2860fa2fff9c2ab7224e91417d7102c205e86c5eb4d475ca8bf76b11d01"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-015:
  statement: "With the flag on, a generated REST controller MUST bind an `OPTIONAL` parameter with `@RequestParam(required = false)`. Required parameters are unchanged."
  statement_sha: "sha256:1b6e5692b84828bd5248d076a43488c03992fa2fd567ae52dd7d80bed0b2d0ee"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-016:
  statement: "With the flag on, each generated MCP tool class MUST: - set `@ToolParam(required = …)` from FR-003; - carry each parameter's effective contract constraints as Jakarta Bean Validation annotations; - be annotated `@Validated`. When `jakarta.validation.constraints.NotNull` does not resolve in the compilation, the processor MUST NOT emit the Bean Validation annotations or `@Validated`. It MUST instead report one NOTE for the compilation saying the MCP constraints will be advisory."
  statement_sha: "sha256:d675a010d543fe91726d49132260f7ca2460286bb508e44733be8d24d1660e55"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-017:
  statement: "With the flag on, the processor MUST write `META-INF/ai-atlas/mcp-tools.json`. It has one entry per AI-channel tool active at the configured major, ordered by tool name, and each entry holds: - the tool name; - `inputSchema`: an object schema with `properties` (one per parameter, with its JSON type and constraints, all inside `properties`, never at the root), `required`, and `additionalProperties: false`; - `annotations`, holding only the hints declared `TRUE` or `FALSE`. The file is deterministic under Phase 2's FR-003 rules. With the flag off, it is not written."
  statement_sha: "sha256:be6cea4876515e4dc012eea82bcbba53d500a71f76d4a5e2a225b67e8aa22329"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-018:
  statement: "The runtime MUST register MCP tools through one lazy `List<SyncToolSpecification>` bean instead of `LazyToolCallbackProvider`. - It builds callbacks with `MethodToolCallbackProvider` over the same beans #42's scan selects, and keeps #42's JDK-proxy skip and warning. - For a tool listed in any `META-INF/ai-atlas/mcp-tools.json` on the classpath, it rebuilds the `McpSchema.Tool` with that `inputSchema` and `annotations`. Every other tool keeps its derived schema, without hints. - Each tool name is registered exactly once. - Two resources listing the same tool name fail startup with a message naming both resources. - This applies to the SYNC server type. With ASYNC or STATELESS, the runtime keeps today's derived registration and logs one INFO line saying schemas and hints are not applied."
  statement_sha: "sha256:076fe9bc7975049f005820d9c9e6ea056363e8ae0a91be752a21c9da8aa45369"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test"
FR-019:
  statement: "When any `mcp-tools.json` is present and the application context has no `MethodValidationPostProcessor` bean, the runtime MUST log one WARNING at startup. The WARNING says MCP constraints are advisory and names `spring-boot-starter-validation`. `spring-boot-starter-validation` MUST NOT become a production dependency of any ai-atlas module."
  statement_sha: "sha256:0b8b0a3c32522af4659c632df4661f4ea55526592390971c0801938d11a410da"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test --tests '*McpToolSpecificationTest'"
FR-020:
  statement: "The Gradle plugin's `agentic { }` extension MUST gain a `constraints` boolean (default `false`). The plugin passes it to the main `compileJava` as `ai.atlas.constraints`, next to the Phase 2 contract options."
  statement_sha: "sha256:4235801f15994367ec1f9fe0170d18fdc76a2652f96858d143fa4e290f7b3357"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-021:
  statement: "The documentation MUST cover the feature, as follows. - A new `docs/constraints-and-hints.md` covering: - the constraint sources and the FR-002 mapping table; - precedence and requiredness; - the contradiction errors and the looser-override warning; - `@AgenticParam` and `@AgenticConstraints`; - hints, stating that they are client guidance, not authorization; - the `ai.atlas.constraints` flag; - enforcement and its optional dependency; - the SYNC-only scope. - `docs/contract-governance.md`: the `irVersion` 2 format, the migration and the new gate rules. - `CHANGELOG.md`: entries under `[Unreleased]`."
  statement_sha: "sha256:9833d0beffcecdb61b91d95716c5f6150250a1e77e5dbe14eb8eab596562f337"
  verifiers:
    - kind: deterministic
      test: "scripts/check-constraints-docs.sh"
FR-022:
  statement: "`./gradlew build` MUST pass with Gradle on JDK 17 and, separately, on JDK 21, run by `scripts/build-on-jdk-matrix.sh`."
  statement_sha: "sha256:8f2a22acfcedbfa8bbc4c622ce2aae0e805818c5d216242337bc8c09a4082cc3"
  verifiers:
    - kind: deterministic
      test: "scripts/build-on-jdk-matrix.sh"
