# Contract: shared/schemas/verification.schema.json
status: draft
feature_id: constraints-and-hints

FR-001:
  statement: "The `annotations` module MUST gain two annotations, and keep zero dependencies: - `@AgenticParam`, targeting method parameters. It has `description` (default `\"\"`) and `required`, of a new enum `Requiredness { DEFAULT, REQUIRED, OPTIONAL }`, default `DEFAULT`. - `@AgenticConstraints`, targeting fields and method parameters, with these attributes. Each has a default that means \"not set\". - `minimum` and `maximum`: decimal strings, default `\"\"`; - `exclusiveMinimum` and `exclusiveMaximum`: booleans, default `false`; - `minLength`, `maxLength`, `minItems` and `maxItems`: ints, default `-1`; - `pattern`: a Java regex with Bean Validation semantics (it must match the *whole* value), default `\"\"`."
  statement_sha: "sha256:38ab5f0d0e7939d3d38e87d290cf23d8449be8fb35691ce6293173882533a0ae"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-002:
  statement: "The processor MUST read Jakarta Bean Validation annotations on `@AgenticField` fields and on the parameters of exposed methods. It identifies them by qualified name, with no compile-time dependency on the validation API, and normalises them as follows: - Which constraints count. Only constraints that apply to the default validation group count: an empty `groups`, or one that contains `jakarta.validation.groups.Default`. Repeated constraints count one by one, whether written directly or through a `.List` container (for example `@Pattern.List`). - `@Min`/`@DecimalMin` become a lower bound, and `@Max`/`@DecimalMax` become an upper bound. A `@DecimalMin`/`@DecimalMax` with `inclusive = false` makes the bound exclusive. - `@Positive` is the exclusive lower bound 0, and `@PositiveOrZero` the inclusive lower bound 0. - `@Negative` is the exclusive upper bound 0, and `@NegativeOrZero` the inclusive upper bound 0. - `@Size` becomes `minLength`/`maxLength` on a `String`, and `minItems`/`maxItems` on a collection or array. Its default bounds (`0` and `Integer.MAX_VALUE`) are not recorded. - `@Pattern` adds its `regexp` and `flags` to the input's set of patterns. The set is unordered, and a value must match every pattern, each as a whole-string Java match. - `@NotNull` makes the input required. - `@NotBlank` makes it required and sets `notBlank`: at least one non-whitespace character anywhere, including across line breaks. It is not translated to a regex. - `@NotEmpty` makes it required with `minLength 1` (a string) or `minItems 1` (a collection or array). - Other constraint annotations, including composed ones, are ignored."
  statement_sha: "sha256:9185225a102d8982e206f48d6d54d789300d098aa600ce86938ed406a160a322"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-003:
  statement: "The effective contract of an input or field MUST be resolved in two steps. The result MUST NOT depend on the order in which annotations are written. - First, intersect the Bean Validation constraints. A value must satisfy every one of them. - Lower bound: the *tightest* of all lower bounds. That is the highest value; at an equal value, an exclusive bound beats an inclusive one. For example, `@Min(10) @Positive` gives the inclusive lower bound 10. - Upper bound: symmetrically, the lowest value, with exclusive winning a tie. - `minLength`/`minItems`: the largest. `maxLength`/`maxItems`: the smallest. - Patterns: the union of all pattern sets. - `notBlank` and requiredness: set if any constraint sets them. - `@NotBlank @Pattern(...)` keeps both. - Then, apply `@AgenticConstraints` per key. A bound, length or item key it sets replaces the intersected value for that key. A non-empty `pattern` replaces the whole pattern set with that one pattern. Every key it does not set keeps the intersected value. - Requiredness comes from `@AgenticParam(required)` when it is not `DEFAULT`; `@AgenticParam(description)`, when non-empty, becomes the parameter's description. - Otherwise a parameter is required when it is a primitive, or carries `@NotNull`, `@NotBlank` or `@NotEmpty`. - Otherwise it is required, as REST query parameters are today."
  statement_sha: "sha256:52323318efcede128dc5456e8d14f2f67341bcdfdeca3cb4aa6765572d890fb6"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-004:
  statement: "The processor MUST report: - A compile ERROR on the element for a self-contradiction. The check runs both on the intersected Bean Validation constraints and on the final effective contract: - a lower bound above the upper bound, or equal bounds with either exclusive (for an integral type, after the FR-008 normalisation, for example `> 4` and `< 5`); - a negative length or item bound, or a `min` above its `max`; - a pattern, or `@AgenticConstraints.pattern`, that does not compile as a Java regex with its flags; - an exclusive flag without its bound; - a length attribute on a non-string, or an item attribute on a non-collection, non-array; - `minimum`/`maximum` on a non-numeric type; - `Requiredness.OPTIONAL` on a primitive, or together with `@NotNull`, `@NotBlank` or `@NotEmpty`. - A WARNING on the parameter when an `@AgenticConstraints` value on an *input* is looser than the Bean Validation constraint it replaces, naming the key and both values. Looser means a lower minimum, a higher maximum, a wider length or item range, or a replaced pattern set. - A WARNING on the element when a pattern cannot be published faithfully in a schema (FR-004a). It names the pattern and the reason. The pattern stays in the IR and stays enforced by Bean Validation, but it is left out of the OpenAPI and MCP schemas."
  statement_sha: "sha256:478038f7790952d5948b4fe8fadc4ed4f05c3429e1f2a0f66999d1f81e0ce35f"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-004a:
  statement: "A pattern is published into a schema only when every value's accept/reject result is the same under Java whole-string matching and under ECMAScript (ECMA-262) matching of the published form. That must hold with and without the `u` flag. A pattern qualifies only when it is written entirely in the portable subset below, and each construct is emitted through the translation below. A pattern outside the subset is *not publishable*: it stays in the IR, is still enforced by Bean Validation, is left out of the OpenAPI and MCP schemas, and produces the FR-004 WARNING naming the first unsupported construct. - Scope: only patterns with no `@Pattern.flags`. - Portable subset, and how each construct is emitted: | Construct in the Java pattern | Emitted as | |---|---| | A literal BMP character other than a metacharacter or a surrogate | itself (`\\uXXXX` if it is not printable ASCII) | | An escaped metacharacter: `\\\\` `\\.` `\\*` `\\+` `\\?` `\\(` `\\)` `\\[` `\\]` `\\{` `\\}` `\\|` `\\^` `\\$` `\\/` | itself | | `\\-` | itself inside a character class; a plain `-` outside one (ECMAScript `u` mode rejects `\\-` outside a class) | | `\\t`, `\\n`, `\\r`, `\\f`, `\\xhh`, `\\uhhhh` (BMP, non-surrogate) | itself | | `\\d` / `\\D` (Java ASCII digits) | `[0-9]` / the negated form below | | `\\w` / `\\W` (Java `[a-zA-Z_0-9]`) | `[a-zA-Z_0-9]` / the negated form below | | `\\s` / `\\S` (Java `[ \\t\\n\\x0B\\f\\r]`) | `[ \\t\\n\\x0B\\f\\r]` / the negated form below | | `.` (Java: any character except `\\n`, `\\r`, U+0085, U+2028, U+2029) | the negated form of `[\\n\\r\\u0085  ]` | | A character class `[...]` of literals, ranges between BMP non-surrogate characters, and the escapes above, optionally negated with `^` | a class with each member translated; a negated class uses the negated form | | Groups `(...)`, non-capturing `(?:...)`, alternation `\\|` | themselves | | Quantifiers `*`, `+`, `?`, `{n}`, `{n,}`, `{n,m}`, and their lazy `?` variants | themselves | - Negated form: Java matches by code point, and ECMAScript without `u` matches by UTF-16 code unit. So every negated atom (`[^X]`, `.`, `\\S`, `\\D`, `\\W`) MUST match exactly one Java code point in both ECMAScript modes. It is emitted as a group with four alternatives: `(?:[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]|[\\uD800-\\uDBFF](?![\\uDC00-\\uDFFF])|(?<![\\uD800-\\uDBFF])[\\uDC00-\\uDFFF]|[^X\\uD800-\\uDFFF])` | Alternative | Matches | |---|---| | `[\\uD800-\\uDBFF][\\uDC00-\\uDFFF]` | a valid surrogate pair, one astral code point, as one unit (without `u`) | | `[\\uD800-\\uDBFF](?![\\uDC00-\\uDFFF])` | a lone high surrogate (Java treats it as one code point) | | `(?<![\\uD800-\\uDBFF])[\\uDC00-\\uDFFF]` | a lone low surrogate | | `[^X\\uD800-\\uDFFF]` | any other code point not in `X` (with `u`, this includes astral code points) | The last alternative excludes all surrogates, and the lone-surrogate alternatives refuse a surrogate that belongs to a pair. So no alternative can match half of a valid pair, and backtracking cannot split one character into two matches. For example, `[^a]{2}` rejects a single U+1F600 in both modes, as Java does. - `X` contains only BMP non-surrogate members, so every astral code point and every lone surrogate is outside `X`, as in Java. - Positive atoms (literals and non-negated classes) are BMP non-surrogate only, so they can never match a surrogate code unit. - The emitted lookbehind is part of the translation, not of the accepted input subset. It requires an ECMAScript 2018+ engine, and the docs state this. - Not in the subset, so not publishable: - anything with flags; - inline flags, possessive quantifiers, atomic groups, lookarounds, backreferences and named groups; - `^` or `$` inside the pattern; - `\\b`, `\\B`, `\\A`, `\\Z`, `\\z`, `\\G`, `\\R`, `\\h`, `\\H`, `\\v`, `\\X`; - any `\\p{…}`/`\\P{…}`, `\\Q…\\E`, octal and `\\x{…}` escapes; - class union or intersection (nested `[` or `&&`); - literal characters outside the BMP, and surrogates. - Anchoring: the published form of a translated pattern `t` is `^(?:t)$`. - `notBlank` is not a regex translation. It is defined as Hibernate Validator 8.0.3's `@NotBlank`, which the project tests with (`NotBlankValidator`: `toString().trim().length() > 0`). The value must contain at least one UTF-16 code unit above U+0020. So U+00A0 and U+2003 count as non-blank, and U+0000–U+0020 do not. It is published as the unanchored pattern `[^\\u0000- ]` together with `minLength 1`. The docs state that other Bean Validation providers may define blankness differently. - Several published patterns on one property, including `notBlank`'s, are written as an `allOf` of single-`pattern` schemas inside that property, never at the schema root."
  statement_sha: "sha256:93db2856995bcdb0a4afcc17c11315792f2f4078f06df0f589dc9ce27563343b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintModelTest'"
FR-005:
  statement: "The Contract IR MUST move to `irVersion` 2: - `Field` gains `constraints`. - `Parameter` gains `constraints` and `required` (boolean). - `Operation` gains `hints`, with `readOnly`, `destructive`, `idempotent` and `openWorld`, each `true`, `false` or absent. - `constraints` is an object with only the keys that are set, in the fixed order `minimum`, `exclusiveMinimum`, `maximum`, `exclusiveMaximum`, `minLength`, `maxLength`, `minItems`, `maxItems`, `patterns`, `notBlank`: - `minimum`/`maximum` are decimal strings, and `exclusiveMinimum`/`exclusiveMaximum` are booleans present only when `true`; - `patterns` is a list of `{regex, flags}` objects, sorted by regex then flags; - this is ai-atlas's own normalised form, and neither schema dialect. - Output stays deterministic under Phase 2's FR-003 rules. - The IR records constraints and hints whether or not the flag is on."
  statement_sha: "sha256:05396d1b251d5c478878de86cea1e50977c259a66505cd08bf4d75f08d7ae5be"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrVersion2Test'"
FR-006:
  statement: "Reading a baseline MUST accept `irVersion` 1 and 2: - A version-1 document is migrated in memory, with every `constraints`, `required` and `hints` value *unknown*: JSON `null` in the model, distinct from an empty object. - `irVersion` above 2 stays an error, as in Phase 2's FR-004. - A version-2 document with a missing or `null` constraint slot is malformed."
  statement_sha: "sha256:41e444b61aa9fd59f6f8cf06bae6c46d54304b12a3ec83034c1e4e3f19dc9b6a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrVersion2Test'"
FR-007:
  statement: "The demo's committed baseline `demo/.atlas/api.ir.json` MUST be regenerated as `irVersion` 2 in the same change that moves the IR to version 2. Phase 2's `ContractBaselineTest` MUST stay green."
  statement_sha: "sha256:6b43ae3b0656a01a94255fa77b2b643861c421a82dbca3c94b94c7ebed987d25"
  verifiers:
    - kind: deterministic
      test: "./gradlew :demo:test --tests '*ContractBaselineTest'"
FR-008:
  statement: "For inputs (operation parameters), compared at the baseline's published major: - Bounds are compared as endpoints, meaning value and exclusivity together, never separately: - An absent lower bound is −∞, and an absent upper bound is +∞. - For an integral Java type (`byte`, `short`, `int`, `long`, their boxes, `BigInteger`), an exclusive bound is first normalised to the inclusive one: `> 9` becomes `>= 10`, and `< 10` becomes `<= 9`. So `> 9` and `>= 10` are the same endpoint and no difference. - A lower endpoint is *tighter* when its value is higher, or equal and exclusive. - An upper endpoint is *tighter* when its value is lower, or equal and exclusive. - Examples: `>= 10` → `> 0` is widening (compatible); `> 0` → `>= 10` is narrowing (breaking); `>= 0` → `> 0` on a decimal is narrowing. - Breaking: - a parameter's `required` goes from `false` to `true`; - a lower or upper endpoint becomes tighter; - `minLength` or `minItems` rises or appears, and `maxLength` or `maxItems` falls or appears; - a pattern is added to the set, which includes a changed pattern, because that is a removal plus an addition; - `notBlank` goes from absent to set. - Compatible: the reverse of each of these. - Never a difference: any change from an *unknown* baseline value."
  statement_sha: "sha256:2882e4edaa039ad9fafd85662ca6894dc0caf3aaee13011aa43c26b2ff0f1576"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-009:
  statement: "Differences in output constraints (entity fields) and in hints MUST be classified as `informational`. They appear in `contract-diff.json` and produce no diagnostic, except in lock mode."
  statement_sha: "sha256:27cec8824756fac5a9cd4e70d9087130687e1254fca2fd2b103aa2217e5a0b63"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-010:
  statement: "In lock mode, every constraint, requiredness and hint difference is a difference, except a change from an *unknown* baseline value. So upgrading ai-atlas does not fail a locked project that has not yet accepted a version-2 baseline."
  statement_sha: "sha256:e0007f5a17b83fcc671c8f1a5d892af8a2dd072c59cd0fe544a652bc54b22324"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-011:
  statement: "Each breaking constraint diagnostic MUST name: - the path `parameter <qualified class>#<method>(<parameter types>).<name>`; - the constraint key, as before → after; - that it narrows an input for clients of major M; - the legitimising declaration: a replacement operation with `apiSince = <M+1>`, or accepting the change with `atlasAccept`."
  statement_sha: "sha256:f30bba4b0bafee46564892fdc875a0792ce9819e5c2d2e9b9401a86afed8aa9f"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGateTest'"
FR-012:
  statement: "The processor MUST accept the option `ai.atlas.constraints`: `true` or `false`, case-insensitive, default `false`. Any other value is a compile ERROR naming the option and the value. With the option `false`, every generated source and resource MUST be byte-identical to before this feature, except the IR files, which the golden snapshot excludes. The golden snapshot test proves this."
  statement_sha: "sha256:02e31c241872fafca794fbf4b8e76f4e81ef4736666c0bd8716404abbe207ecc"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrRewireGoldenTest'"
FR-013:
  statement: "`@AgenticExposed` MUST gain `readOnly`, `destructive`, `idempotent` and `openWorld`, of a new enum `Hint { UNSET, TRUE, FALSE }`, each default `UNSET`. - A method-level value other than `UNSET` overrides the class-level one. - Nothing is inferred from method names, parameters or HTTP method. - With the flag on, an AI-channel method whose four resolved hints are all `UNSET` gets a WARNING naming the method, which becomes an ERROR under `ai.atlas.strict`."
  statement_sha: "sha256:3f0caba30f1de891f73e7ea5a1980bf5a7e16f41aea64aa38047ac5bd468613a"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-014:
  statement: "With the flag on, the OpenAPI document (OpenAPI 3.0.3, which ai-atlas generates today) MUST describe: - each query parameter's `required` from FR-003, and its constraints on the parameter schema; - each DTO property's field constraints on the component schema. Constraints are written in the OpenAPI 3.0 Schema Object dialect: - bounds as `minimum`/`maximum`, with boolean `exclusiveMinimum`/`exclusiveMaximum: true` for exclusive ones; - lengths and items as `minLength`, `maxLength`, `minItems` and `maxItems`; - patterns per FR-004a. A test MUST parse the generated document with the OpenAPI parser already used by the processor's tests and assert that it reports no validation messages."
  statement_sha: "sha256:52abd609b312477f8303826352bcc7446c0f3d47c94b1bd5654f479c261a363b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RegexConsistencyTest'"
FR-015:
  statement: "With the flag on, a generated REST controller MUST bind an `OPTIONAL` parameter with `@RequestParam(required = false)`. Required parameters are unchanged."
  statement_sha: "sha256:1b6e5692b84828bd5248d076a43488c03992fa2fd567ae52dd7d80bed0b2d0ee"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-016:
  statement: "With the flag on, each generated MCP tool class MUST: - set `@ToolParam(required = …)` from FR-003; - carry each parameter's effective contract (FR-003) as Jakarta Bean Validation annotations, after intersection and overrides, never the raw source annotations: - bounds become `@DecimalMin`/`@DecimalMax` with `inclusive`; - lengths and items become `@Size`; - each pattern becomes a `@Pattern` with its `regexp` and `flags`; - `notBlank` becomes `@NotBlank`; - a required reference type gets `@NotNull`; - be annotated `@Validated`. When `jakarta.validation.constraints.NotNull` does not resolve in the compilation, the processor MUST NOT emit the Bean Validation annotations or `@Validated`. It MUST instead report one NOTE for the compilation saying the MCP constraints will be advisory."
  statement_sha: "sha256:d483b678f75da01833b67648bbc0978dc88c084afb25110be22ec3fb34b388c8"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-017:
  statement: "With the flag on, the processor MUST write `META-INF/ai-atlas/mcp-tools.json`. It has one entry per AI-channel tool active at the configured major, ordered by tool name, and each entry holds: - the tool name; - `inputSchema`, in the JSON Schema 2020-12 dialect, which MCP uses for tool input schemas: - an object schema with `\"$schema\": \"https://json-schema.org/draft/2020-12/schema\"`, `properties` (one per parameter, with its JSON type and constraints, all inside `properties`, never at the root), `required`, and `additionalProperties: false`; - an inclusive bound is written as `minimum`/`maximum`, and an exclusive one as the numeric `exclusiveMinimum`/`exclusiveMaximum` *instead of* `minimum`/`maximum`. For example, `@Positive` becomes `exclusiveMinimum: 0`; - lengths, items and patterns are written as in FR-014 (patterns per FR-004a). - `annotations`, holding only the hints declared `TRUE` or `FALSE`. The file is deterministic under Phase 2's FR-003 rules. With the flag off, it is not written. A test MUST validate every generated `inputSchema` against the JSON Schema 2020-12 metaschema, offline. The metaschema is bundled by a test-only validator library, never fetched over the network."
  statement_sha: "sha256:57ab6a721a7c0511d1d8dac26aca1eaace345b3254e9b1f79ba74f886467f2fe"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ConstraintGenerationTest'"
FR-017a:
  statement: "Regex semantics MUST agree across the three places a value is checked, for every published constraint: - Bean Validation on the generated MCP tool class, using the Hibernate Validator the project tests with; - the `mcp-tools.json` input schema; - the OpenAPI parameter schema. Published patterns MUST be evaluated by an ECMAScript regex engine, such as GraalJS through a test-only dependency (for example networknt's `GraalJSRegularExpressionFactory`). They MUST be evaluated both without and with the `u` flag. A Java-backed regex engine MUST NOT be used for the schema side, because it would hide exactly these differences. A shared fixture asserts identical accept/reject results for: - `@Pattern(\"[A-Z]+\")`: accepts `\"ABC\"`, rejects `\"xABCy\"`; - `@Pattern(\"\\\\s+\")`: accepts `\" \\t\"`, rejects U+00A0, U+2003, U+0085 and U+FEFF; - `@Pattern(\"\\\\S+\")`: accepts U+00A0 and U+2003; - `@Pattern(\".\")`: accepts `\"a\"`, U+00A0 and U+1F600 (one code point), rejects U+0085, U+2028 and `\"\\n\"`; - `@Pattern(\"[^a]\")`: accepts U+1F600; - Quantified and adjacent negated atoms, which catch a pair being split under backtracking: - `@Pattern(\"[^a]{2}\")`, `@Pattern(\".{2}\")` and `@Pattern(\"\\\\S{2}\")`: reject a single U+1F600, accept U+1F600 U+1F600 and `\"xy\"`; - `@Pattern(\"[^a][^b]\")` and `@Pattern(\".\\\\S\")`: reject a single U+1F600, accept `\"x\"` + U+1F600; - `@Pattern(\".+x\")`: accepts U+1F600 + `\"x\"`, rejects `\"x\"`; - `@Pattern(\"[^a]*b\")`: accepts U+1F600 U+1F600 `\"b\"`; - Lone surrogates, evaluated as Java strings and as the same UTF-16 sequence on the ECMAScript side: with `@Pattern(\".\")` and `@Pattern(\"[^a]\")`, a lone high surrogate U+D83D and a lone low surrogate U+DE00 are each accepted; the reversed sequence U+DE00 U+D83D is rejected by `.` and accepted by `.{2}`; - `@Pattern(\"\\\\d+\")` rejects `\"٣\"` (U+0663), and `@Pattern(\"\\\\w+\")` rejects `\"é\"`; - `@NotBlank`: accepts `\"a\\nb\"`, `\" a \"`, U+00A0 and U+2003, rejects `\"\"`, `\" \"`, `\"\\n\\t\"` and U+0000; - `@NotBlank @Pattern(\"[a-z ]+\")`: rejects `\" \"`, accepts `\" ab \"`. For constraints that are not published, the assertion is deliberately one-sided: Bean Validation rejects, and both schemas accept because they omit the constraint. The cases are a `@Pattern` with `CASE_INSENSITIVE`, a possessive quantifier, `\\b`, `\\p{L}`, and a literal U+1F600 in the pattern. Each also produces the FR-004 WARNING."
  statement_sha: "sha256:c3dd70ce61c397ada55cc4ed3a6cc7ac397c665fbed11f0e411460c4c2f7089e"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*RegexConsistencyTest'"
FR-018:
  statement: "The runtime MUST register MCP tools through one lazy `List<SyncToolSpecification>` bean instead of `LazyToolCallbackProvider`. - It builds callbacks with `MethodToolCallbackProvider` over the same beans #42's scan selects, and keeps #42's JDK-proxy skip and warning. - For a tool listed in any `META-INF/ai-atlas/mcp-tools.json` on the classpath, it rebuilds the `McpSchema.Tool` with that `inputSchema` and `annotations`. Every other tool keeps its derived schema, without hints. - Each tool name is registered exactly once. - Two resources listing the same tool name fail startup with a message naming both resources. - This applies to the SYNC server type. With ASYNC or STATELESS, the runtime keeps today's derived registration and logs one INFO line saying schemas and hints are not applied."
  statement_sha: "sha256:076fe9bc7975049f005820d9c9e6ea056363e8ae0a91be752a21c9da8aa45369"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test"
FR-019:
  statement: "When any `mcp-tools.json` is present and the application context has no `MethodValidationPostProcessor` bean, the runtime MUST log one WARNING at startup. The WARNING says MCP constraints are advisory and names `spring-boot-starter-validation`. `spring-boot-starter-validation` MUST NOT become a production dependency of any ai-atlas module."
  statement_sha: "sha256:0b8b0a3c32522af4659c632df4661f4ea55526592390971c0801938d11a410da"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:runtime:test --tests '*McpToolSpecificationTest'"
FR-020:
  statement: "The Gradle plugin's `agentic { }` extension MUST gain a `constraints` boolean (default `false`). The plugin passes it to the main `compileJava` as `ai.atlas.constraints`, next to the Phase 2 contract options."
  statement_sha: "sha256:4235801f15994367ec1f9fe0170d18fdc76a2652f96858d143fa4e290f7b3357"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-021:
