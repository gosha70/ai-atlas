# Contract: shared/schemas/verification.schema.json
status: draft
feature_id: contract-ir-gate

FR-001:
  statement: "The processor MUST build a Contract IR from every `@AgenticEntity` and every `@AgenticExposed` declaration in the compilation, independent of the configured `ai.atlas.api.major`. It MUST include every entity; every `@AgenticField` with its lifecycle (`sinceVersion`, `removedInVersion`, `deprecatedSinceVersion`, `deprecatedMessage`); and every exposed method with its lifecycle (`apiSince`, `apiUntil`, `apiDeprecatedSince`, `apiReplacement`), after class-level inheritance is resolved. Elements inactive at the configured major MUST be included."
  statement_sha: "sha256:ff458642b050fe48b4355f675fc5edb64916f550c186dd38649fa66ea9d0c8ca"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-002:
  statement: "The IR MUST record, per entity: the source class's qualified name (its identity), DTO name, DTO package, display name, description, `includeTypeInfo`, and its fields in the order the generated DTO declares them. Per field: Java name, display name, Java type, collection kind and element type, type hint (`@AgenticField(type = …)`) if any, referenced entity and its DTO (qualified names) if any, allowed values or enum constants, `openEnum`, `sensitive`, `checkCircularReference`, description, type hint, and lifecycle. Per operation: identity (service qualified name, method name, parameter Java types), MCP tool name, channels, description, REST HTTP method and path, parameters (name, Java type, description, allowed enum constants when the type is an enum), return (Java type, return kind, the effective `@AgenticExposed(returnType = …)` after method-then-class resolution if any, and the referenced entity and its DTO, qualified names, if any), and lifecycle. At document level: `irVersion`, `apiBasePath`, and `apiMajor` (the configured major the document was emitted for)."
  statement_sha: "sha256:3528eb25caad99fa4c4ce898dfbfdd423f747f09dc91a47ecb6fe471fbb053a4"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-003:
  statement: "The processor MUST write the IR to the class output as `META-INF/ai-atlas/api.ir.json`, deterministically. The same input sources and processor options MUST produce a byte-identical file: - entities ordered by qualified name, operations by service qualified name then method identity, fields and parameters in declaration order; - a fixed key order within every object; - UTF-8, `\\n` line endings, two-space indentation, and a trailing newline; - no timestamps, absolute paths, host names or other environment data."
  statement_sha: "sha256:a560a2d536c91b432fbeb2f6a8ea8e63eb1e45cd12b0e2c40f5aa99930fbed88"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-004:
  statement: "The IR MUST carry `\"irVersion\": 1`. When the processor reads a baseline, it MUST handle three cases: - an `irVersion` above the one it supports is a compile ERROR naming both versions and saying the baseline was written by a newer ai-atlas; - a lower `irVersion` is migrated in memory by the documented migration step for that version; - a baseline that is not valid IR JSON is a compile ERROR naming the file and the parse failure."
  statement_sha: "sha256:dd979c2187b18b2deddea46865415bcf0723e1dc12e8a91b2dd29ea5f82916f4"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-005:
  statement: "The IR MUST contain only plain JSON values. Java types are recorded as canonical source-form strings (for example `java.util.List<com.x.Order>`, `long`, `java.lang.String[]`), and no framework runtime type is serialized."
  statement_sha: "sha256:77dade5e5c0707fdf8fc86cfb1a14f0fbfc529e193dd52e92a3441bcd43c4a16"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-006:
  statement: "`DtoGenerator`, `McpToolGenerator`, `RestControllerGenerator`, `OpenApiGenerator` and `DeprecationManifestGenerator` MUST receive their entity and service models from a projection of the IR at the configured major. Selecting active fields and methods and marking deprecation MUST happen in that projection, and `FieldScanner` MUST no longer filter fields by `apiMajor`. The projection MUST also assign each active operation's OpenAPI `operationId`, using today's rule from `OpenApiGenerator` over the whole projection, and `OpenApiGenerator` MUST use those IDs, so that the generator and the gate (FR-010) share one derivation. Existing diagnostics MUST be preserved with the same kind and text: the \"excluded from … DTO — not active for apiMajor\" note, the empty-entity warning and error, the version-range validation errors, and #25's collision, mapping and description diagnostics."
  statement_sha: "sha256:fd537bc22463cbd2ccc6f1acdb006bae86a231fb93efed246b46867ec3629d61"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test"
FR-007:
  statement: "For every input, the generated sources and resources MUST be byte-identical to those produced before this feature, excluding the new IR files. A golden snapshot captured before the rewire MUST prove it. The snapshot covers the demo module's sources at its configured options and a processor fixture set with: - fields and methods inactive at the configured major; - deprecated fields and methods; - enum, collection, nested-entity and type-hint fields; - `void` methods, overloads, and every #25 fixture in `RestOpenApiConsistencyTest`; - two services each exposing a `find()`, so that shared operation IDs are qualified; - a compilation with no ai-atlas annotation, which produces no generated file."
  statement_sha: "sha256:a8378eefdff5b47c5d981f2f13e603d9da1729888b1e943d2e896cdcd8b0af61"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrRewireGoldenTest'"
FR-008:
  statement: "When the processor option `ai.atlas.contract.baseline` names an existing file, the processor MUST compare the baseline IR with the fresh IR, both projected at M, the baseline document's `apiMajor`. It MUST classify every difference between the two projections as breaking or compatible, using FR-009 and FR-010. When the option is unset or the file does not exist, the processor MUST NOT compare. It MUST emit one NOTE naming the expected baseline path and `atlasAccept`, except in lock mode (FR-014). A configured `ai.atlas.api.major` lower than M MUST be a compile ERROR naming both majors. The comparison reads only the baseline file and the compilation: no network, database or model call. The gate MUST also run when the compilation declares no `@AgenticEntity` or `@AgenticExposed` at all (an empty contract), because removing a module's last ai-atlas annotation removes its whole published contract: - the processor MUST declare `*` as its supported annotation types, so that javac invokes it for every compilation it is on the processor path of, and `process` MUST return `false` so that it never claims annotations from other processors; - it MUST remain registered with Gradle as `aggregating`, and a change to an ordinary source file MUST NOT cause Gradle to report a full recompilation because of it; - when a baseline is configured and the compilation declares nothing, the fresh IR is an empty document carrying the configured `apiBasePath` and `apiMajor`. The processor MUST write it as `api.ir.json` and compare it, so every element active at M in the baseline is reported as removed (FR-009, FR-010, FR-012). Apart from `api.ir.json` and `contract-diff.json` it MUST generate nothing, as before this feature; - when no baseline is configured, the lock option is false, and the compilation declares nothing, the processor MUST write no file and emit no diagnostic."
  statement_sha: "sha256:bce195179d03a27eca6bf8c797de5a02d817161986bebf62a79152749be4474b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-009:
  statement: "Output differences (entity fields and operation returns) MUST be classified as follows. A field's effective schema is its Java type, collection kind, element type, type hint, and referenced entity and DTO. An operation's effective return schema is its return Java type, return kind, effective `returnType`, and referenced entity and DTO. Both matter because the DTO a response refers to can change while the Java signature stays the same: a method returning `List<?>` can move from `returnType = Order.class` to `returnType = Customer.class` with both entities still declared. - Breaking: - a field present in the old projection is absent from the new; - a field's Java name or display name changed; - any part of a field's effective schema changed, including only its type hint or the entity or DTO it refers to; - its `sensitive` changed from false to true; - an entity's DTO name or DTO package changed, or its `includeTypeInfo` changed; - a value was added to a field's enum constants or allowed values while the field's `openEnum` is false; - any part of an operation's effective return schema changed, whether through its method signature, a method-level or a class-level `returnType`; - the document's `apiBasePath` changed. - Compatible, and MUST NOT be reported as errors: - a field was added; - `sensitive` changed from true to false; - an output enum or allowed value was removed; - a value was added while `openEnum` is true; - description, deprecation and `checkCircularReference` changed."
  statement_sha: "sha256:b2af06abeb3f1a5fd2654802a03dbeeef16072dd2c7054c16977a80517a0e9fb"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-010:
  statement: "Input and operation differences MUST be classified as follows. - Breaking: - an operation present in the old projection is absent from the new; the identity includes the parameter types, so any change to their number, order or types is a removal; - a parameter's name changed; - a channel was removed from an operation; - its MCP tool name changed; - its REST HTTP method or path changed; - its OpenAPI `operationId` changed. The IDs are derived from each whole projection at M (FR-006), so this includes a rename caused only by another operation being added, for example a second API-exposed `find()` in another service turning the existing `find` into a qualified ID; - a value was removed from the allowed enum constants of an input parameter. - Compatible: - an operation was added, provided that no operation present in both projections changes its `operationId`, REST path, HTTP method or MCP tool name as a result; - a channel was added; - a value was added to an input enum parameter; - description and deprecation changed."
  statement_sha: "sha256:df9e58f129cd40d60e893d26fa222e3296bb2a0f1f5dc6b9c5cae0fa24830429"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-011:
  statement: "`@AgenticField` MUST gain `boolean openEnum() default false`, recorded in the IR. Setting it true on a field that is neither enum-typed nor has `allowedValues` MUST be a WARNING naming the field."
  statement_sha: "sha256:22c28247ce828a219d3c01fd6beb110e45a56a02947856bfd089e333e573c963"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-012:
  statement: "In the default (unlocked) mode, every breaking difference MUST be a compile ERROR. It is reported on the declaration element when one still exists in the compilation, and without an element otherwise. Each message MUST name: - the element path, as `entity <qualified class>`, `field <qualified class>#<java name>` or `operation <qualified class>#<method>(<parameter types>)`; - the change as before → after; - the direction (input or output) and why it breaks clients of major M; - the declaration that would legitimise it: - a removed or changed field, including a changed effective schema → `@AgenticField(removedInVersion = <M+1>)` on the old field, with any replacement as a new field with `sinceVersion = <M+1>`; - a removed or changed operation, including a changed effective return schema → `@AgenticExposed(apiUntil = <M>)` plus a replacement with `apiSince = <M+1>`; - a changed `operationId` → the operation(s) whose addition caused it, and giving the new operation a method name that does not collide, or `apiSince = <M+1>` on it; - a changed DTO name, DTO package or `apiBasePath` → restoring the previous value; - an empty contract → restoring the annotations, or accepting the removal; - an added response enum value → `openEnum = true` if clients tolerate unknown values; - in all cases, accepting the change explicitly with `atlasAccept`. Compatible differences produce no diagnostic."
  statement_sha: "sha256:ff1c33dad3e9ce8933f5461b68f8f79b4ea6711524f5cc5dbdece17988978899"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-013:
  statement: "Whenever a comparison runs, the processor MUST also write `META-INF/ai-atlas/contract-diff.json`, listing every difference with its element path, direction, before and after values, and classification. It is deterministically ordered by element path, and an empty list is written when there are none."
  statement_sha: "sha256:f8cc50d21ee70d72dcf575ba716c23e776aea8cf5b5420d6662bd09140fb2157"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-014:
  statement: "The processor MUST accept the option `ai.atlas.contract.locked` (`true` or `false`, case-insensitive, default `false`; any other value is a compile ERROR naming option and value). When it is true: - any difference between the baseline and fresh IR documents MUST be a compile ERROR, listing each differing element path. This covers every declaration and attribute, including elements inactive at M and the document's `apiMajor`, and includes compatible ones; - a missing baseline MUST be a compile ERROR naming the expected path and `atlasAccept`."
  statement_sha: "sha256:7452a71e3e6a74cd17e1c5e7d7fe4714b4838a110acf152f0623a38b04a884ec"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractLockTest'"
FR-015:
  statement: "The Gradle plugin MUST provide a task `atlasAccept` that writes the IR of the current sources to the baseline path, creating the directory. The written file MUST be byte-identical to the `api.ir.json` the processor emits for the same sources and options. The task MUST succeed when the gate or lock mode would currently fail the build, and it MUST print the accepted differences grouped by classification. A subsequent `build` MUST then pass the gate and lock mode."
  statement_sha: "sha256:c1d070e1994ad154e70f69ae3ddfb8a5563488f14c795e7d88372cf18d646418"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-016:
  statement: "The Gradle plugin's `agentic { }` extension MUST add two properties: - `contractBaseline`, a file property defaulting to `<projectDir>/.atlas/api.ir.json`; - `contractLocked`, a boolean defaulting to `false`. The plugin MUST pass both as `ai.atlas.contract.baseline` (absolute path) and `ai.atlas.contract.locked` to the main source set's `compileJava` task only. No other compilation receives them, so a test compilation that declares no ai-atlas annotation is never compared against the main baseline (FR-008). It MUST declare the baseline file as an optional input of that task, so that creating, editing or accepting the baseline re-runs the gate."
  statement_sha: "sha256:fa38f9920a20be41c9ea0895c866a6ea4d6e48b5a88bdb8249c17c0ac8ee4d4b"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-017:
  statement: "The `atlas` CLI (`-A`) and the STDIO MCP server (`options`) MUST pass `ai.atlas.contract.baseline` and `ai.atlas.contract.locked` through unchanged. A gate failure MUST surface as a failed generation carrying the gate's diagnostic: exit code 1 with `status: error` for the CLI's `--json`, and an `isError` result for MCP."
  statement_sha: "sha256:7b46dade8d23de67ccdff0899f9dd61c6db8487d87438d9c8940c0d9b0574759"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:cli:test --tests '*ContractGatePassThroughTest' && ./gradlew :modules:mcp-stdio:test --tests '*ContractGatePassThroughTest'"
FR-018:
  statement: "The demo module MUST commit its baseline as `demo/.atlas/api.ir.json`, produced by the processor from the demo sources and options. `demo/build.gradle.kts` MUST pass `ai.atlas.contract.baseline` pointing at it, to the main `compileJava` task only. A demo test MUST assert that the committed baseline is byte-identical to the IR the demo build emits, so the demo's contract cannot change without its baseline being updated in the same change."
  statement_sha: "sha256:d69a212cb3c4bf31fedf1c82fa1faa79a36d76a37b3df84c895097e27a9f4494"
  verifiers:
    - kind: deterministic
      test: "./gradlew :demo:test --tests '*ContractBaselineTest'"
FR-019:
  statement: "The documentation MUST cover the feature: - a new `docs/contract-governance.md` describing the IR document (fields and `irVersion`), the gate's rules as tables of breaking and compatible changes per direction, the projection at the baseline's published major, `openEnum`, accept, lock mode, the baseline file's place in version control, and the policy that each future `irVersion` ships a documented in-memory migration from the previous one; - `docs/annotation-guide.md` documenting `openEnum`; - `CHANGELOG.md` gaining entries under `[Unreleased]` for the IR, the gate, `openEnum`, `atlasAccept` and lock mode."
  statement_sha: "sha256:16e0d0962866220f54684793a23e3162e31c706d85088e638eac6f7d89cf9031"
  verifiers:
    - kind: deterministic
      test: "scripts/check-contract-docs.sh"
FR-020:
  statement: "`./gradlew build` MUST pass with Gradle on JDK 17 and, separately, on JDK 21, run by `scripts/build-on-jdk-matrix.sh`."
  statement_sha: "sha256:97a6a5fcba55738fc057a57d8972e17247a307c71386d8adab1dc3e917fbb2e7"
  verifiers:
    - kind: deterministic
      test: "scripts/build-on-jdk-matrix.sh"
