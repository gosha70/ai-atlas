# entry, replace every placeholder with a real executable verifier,
# then set status: finalized. spec.md is the only authoritative
# source of requirement text; statement below is display-only and
# statement_sha binds it (admission recomputes and fails on drift).
# Verifier kinds: deterministic (test: <path|command>),
#   runtime_conformance (criterion: judged against the RUNNING app),
#   visual (criterion: judged against the RENDERED app). Mapping any
#   FR to kind: visual is what puts UI IN SCOPE — admission then
#   requires the UI bundle (DESIGN.md, harness/, copilot:review).
# The visual placeholder below each FR is an author-decision
#   SCAFFOLD, not a claim that the FR is UI-visible: write a
#   concrete criterion if it is, otherwise REMOVE the verifier.
#   Leaving it unresolved keeps the artifact inadmissible.
# Contract: shared/schemas/verification.schema.json
status: draft
feature_id: contract-ir-gate

FR-001:
  statement: "The processor MUST build a Contract IR from every `@AgenticEntity` and every `@AgenticExposed` declaration in the compilation, independent of the configured `ai.atlas.api.major`. It MUST include every entity; every `@AgenticField` with its lifecycle (`sinceVersion`, `removedInVersion`, `deprecatedSinceVersion`, `deprecatedMessage`); and every exposed method with its lifecycle (`apiSince`, `apiUntil`, `apiDeprecatedSince`, `apiReplacement`), after class-level inheritance is resolved. Elements inactive at the configured major MUST be included."
  statement_sha: "sha256:ff458642b050fe48b4355f675fc5edb64916f550c186dd38649fa66ea9d0c8ca"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-002:
  statement: "The IR MUST record, per entity: the source class's qualified name (its identity), DTO name, DTO package, display name, description, `includeTypeInfo`, and its fields in the order the generated DTO declares them. Per field: Java name, display name, Java type, collection kind and element type, referenced entity if any, allowed values or enum constants, `openEnum`, `sensitive`, `checkCircularReference`, description, type hint, and lifecycle. Per operation: identity (service qualified name, method name, parameter Java types), MCP tool name, channels, description, REST HTTP method and path, parameters (name, Java type, description, allowed enum constants when the type is an enum), return (Java type, return kind, referenced entity and DTO if any), and lifecycle. At document level: `irVersion`, `apiBasePath`, and `apiMajor` (the configured major the document was emitted for)."
  statement_sha: "sha256:7ac5e8f41b8398d1069ed61821702cd9c5172a11782ce0f2456ba49580bf9ceb"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-003:
  statement: "The processor MUST write the IR to the class output as `META-INF/ai-atlas/api.ir.json`, deterministically. The same input sources and processor options MUST produce a byte-identical file: - entities ordered by qualified name, operations by service qualified name then method identity, fields and parameters in declaration order; - a fixed key order within every object; - UTF-8, `\\n` line endings, two-space indentation, and a trailing newline; - no timestamps, absolute paths, host names or other environment data."
  statement_sha: "sha256:a560a2d536c91b432fbeb2f6a8ea8e63eb1e45cd12b0e2c40f5aa99930fbed88"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-004:
  statement: "The IR MUST carry `\"irVersion\": 1`. When the processor reads a baseline, it MUST handle three cases: - an `irVersion` above the one it supports is a compile ERROR naming both versions and saying the baseline was written by a newer ai-atlas; - a lower `irVersion` is migrated in memory by the documented migration step for that version; - a baseline that is not valid IR JSON is a compile ERROR naming the file and the parse failure."
  statement_sha: "sha256:dd979c2187b18b2deddea46865415bcf0723e1dc12e8a91b2dd29ea5f82916f4"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-005:
  statement: "The IR MUST contain only plain JSON values. Java types are recorded as canonical source-form strings (for example `java.util.List<com.x.Order>`, `long`, `java.lang.String[]`), and no framework runtime type is serialized."
  statement_sha: "sha256:77dade5e5c0707fdf8fc86cfb1a14f0fbfc529e193dd52e92a3441bcd43c4a16"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractIrTest'"
FR-006:
  statement: "`DtoGenerator`, `McpToolGenerator`, `RestControllerGenerator`, `OpenApiGenerator` and `DeprecationManifestGenerator` MUST receive their entity and service models from a projection of the IR at the configured major. Selecting active fields and methods and marking deprecation MUST happen in that projection, and `FieldScanner` MUST no longer filter fields by `apiMajor`. Existing diagnostics MUST be preserved with the same kind and text: the \"excluded from … DTO — not active for apiMajor\" note, the empty-entity warning and error, the version-range validation errors, and #25's collision, mapping and description diagnostics."
  statement_sha: "sha256:5e753968050d0b30dd606a66698cf2d3110dab102ba24c66e42cc3282bab182f"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test"
FR-007:
  statement: "For every input, the generated sources and resources MUST be byte-identical to those produced before this feature, excluding the new IR files. A golden snapshot captured before the rewire MUST prove it. The snapshot covers the demo module's sources at its configured options and a processor fixture set with: - fields and methods inactive at the configured major; - deprecated fields and methods; - enum, collection, nested-entity and type-hint fields; - `void` methods, overloads, and every #25 fixture in `RestOpenApiConsistencyTest`."
  statement_sha: "sha256:69e85b7ff49ebe3e5f324c1785a6c1d1bb9d6de045e4e60993839e22662e4925"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*IrRewireGoldenTest'"
FR-008:
  statement: "When the processor option `ai.atlas.contract.baseline` names an existing file, the processor MUST compare the baseline IR with the fresh IR, both projected at M, the baseline document's `apiMajor`. It MUST classify every difference between the two projections as breaking or compatible, using FR-009 and FR-010. When the option is unset or the file does not exist, the processor MUST NOT compare. It MUST emit one NOTE naming the expected baseline path and `atlasAccept`, except in lock mode (FR-014). A configured `ai.atlas.api.major` lower than M MUST be a compile ERROR naming both majors. The comparison reads only the baseline file and the compilation: no network, database or model call."
  statement_sha: "sha256:a214715bab82cef21c7df57b4edb17cbec4e2e99a3db41042a73497b6717874f"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-009:
  statement: "Output differences (entity fields and operation returns) MUST be classified as follows. - Breaking: - a field present in the old projection is absent from the new; - a field's Java name or display name changed; - its Java type or collection kind changed; - its `sensitive` changed from false to true; - an entity's `includeTypeInfo` changed; - a value was added to a field's enum constants or allowed values while the field's `openEnum` is false; - an operation's return Java type or return kind changed. - Compatible, and MUST NOT be reported as errors: - a field was added; - `sensitive` changed from true to false; - an output enum or allowed value was removed; - a value was added while `openEnum` is true; - description, deprecation and `checkCircularReference` changed."
  statement_sha: "sha256:91f5c232d8097050fbee3dfdecd628c3cdd1a8601b80773d1476b81b82176919"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-010:
  statement: "Input and operation differences MUST be classified as follows. - Breaking: - an operation present in the old projection is absent from the new; the identity includes the parameter types, so any change to their number, order or types is a removal; - a parameter's name changed; - a channel was removed from an operation; - its MCP tool name changed; - its REST HTTP method or path changed; - a value was removed from the allowed enum constants of an input parameter. - Compatible: - an operation was added; - a channel was added; - a value was added to an input enum parameter; - description and deprecation changed."
  statement_sha: "sha256:8e5c02888313f66877bb352d8ac9e19ee6e08e89d5b5acf0761b5b1c48ebb9b5"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-011:
  statement: "`@AgenticField` MUST gain `boolean openEnum() default false`, recorded in the IR. Setting it true on a field that is neither enum-typed nor has `allowedValues` MUST be a WARNING naming the field."
  statement_sha: "sha256:22c28247ce828a219d3c01fd6beb110e45a56a02947856bfd089e333e573c963"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-012:
  statement: "In the default (unlocked) mode, every breaking difference MUST be a compile ERROR. It is reported on the declaration element when one still exists in the compilation, and without an element otherwise. Each message MUST name: - the element path, as `entity <qualified class>`, `field <qualified class>#<java name>` or `operation <qualified class>#<method>(<parameter types>)`; - the change as before → after; - the direction (input or output) and why it breaks clients of major M; - the declaration that would legitimise it: - a removed or changed field → `@AgenticField(removedInVersion = <M+1>)` instead; - a removed or changed operation → `@AgenticExposed(apiUntil = <M>)` plus a replacement with `apiSince = <M+1>`; - an added response enum value → `openEnum = true` if clients tolerate unknown values; - in all cases, accepting the change explicitly with `atlasAccept`. Compatible differences produce no diagnostic."
  statement_sha: "sha256:0bf52510c05522405e5c9c2da498e3609d7c3220e2f0175f12799d2616a44a98"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-013:
  statement: "Whenever a comparison runs, the processor MUST also write `META-INF/ai-atlas/contract-diff.json`, listing every difference with its element path, direction, before and after values, and classification. It is deterministically ordered by element path, and an empty list is written when there are none."
  statement_sha: "sha256:f8cc50d21ee70d72dcf575ba716c23e776aea8cf5b5420d6662bd09140fb2157"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractGateTest'"
FR-014:
  statement: "The processor MUST accept the option `ai.atlas.contract.locked` (`true` or `false`, case-insensitive, default `false`; any other value is a compile ERROR naming option and value). When it is true: - any difference between the baseline and fresh IR documents MUST be a compile ERROR, listing each differing element path. This covers every declaration and attribute, including elements inactive at M and the document's `apiMajor`, and includes compatible ones; - a missing baseline MUST be a compile ERROR naming the expected path and `atlasAccept`."
  statement_sha: "sha256:7452a71e3e6a74cd17e1c5e7d7fe4714b4838a110acf152f0623a38b04a884ec"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:processor:test --tests '*ContractLockTest'"
FR-015:
  statement: "The Gradle plugin MUST provide a task `atlasAccept` that writes the IR of the current sources to the baseline path, creating the directory. The written file MUST be byte-identical to the `api.ir.json` the processor emits for the same sources and options. The task MUST succeed when the gate or lock mode would currently fail the build, and it MUST print the accepted differences grouped by classification. A subsequent `build` MUST then pass the gate and lock mode."
  statement_sha: "sha256:c1d070e1994ad154e70f69ae3ddfb8a5563488f14c795e7d88372cf18d646418"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-016:
  statement: "The Gradle plugin's `agentic { }` extension MUST add two properties: - `contractBaseline`, a file property defaulting to `<projectDir>/.atlas/api.ir.json`; - `contractLocked`, a boolean defaulting to `false`. The plugin MUST pass both as `ai.atlas.contract.baseline` (absolute path) and `ai.atlas.contract.locked`. It MUST declare the baseline file as an optional input of Java compilation, so that creating, editing or accepting the baseline re-runs the gate."
  statement_sha: "sha256:9c8d82b2baab379c477605b7198d1c231fc34898f9d19503114e18639635038d"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:gradle-plugin:functionalTest"
FR-017:
  statement: "The `atlas` CLI (`-A`) and the STDIO MCP server (`options`) MUST pass `ai.atlas.contract.baseline` and `ai.atlas.contract.locked` through unchanged. A gate failure MUST surface as a failed generation carrying the gate's diagnostic: exit code 1 with `status: error` for the CLI's `--json`, and an `isError` result for MCP."
  statement_sha: "sha256:7b46dade8d23de67ccdff0899f9dd61c6db8487d87438d9c8940c0d9b0574759"
  verifiers:
    - kind: deterministic
      test: "./gradlew :modules:cli:test --tests '*ContractGatePassThroughTest' && ./gradlew :modules:mcp-stdio:test --tests '*ContractGatePassThroughTest'"
FR-018:
  statement: "The demo module MUST commit its baseline as `demo/.atlas/api.ir.json`, produced by the processor from the demo sources and options. `demo/build.gradle.kts` MUST pass `ai.atlas.contract.baseline` pointing at it. A demo test MUST assert that the committed baseline is byte-identical to the IR the demo build emits, so the demo's contract cannot change without its baseline being updated in the same change."
  statement_sha: "sha256:743e0b81593ebca60a74daf9e72b4bd3fcb0b9f666e13c0127b736fddb56af35"
  verifiers:
    - kind: deterministic
      test: "./gradlew :demo:test --tests '*ContractBaselineTest'"
FR-019:
  statement: "The documentation MUST cover the feature: - a new `docs/contract-governance.md` describing the IR document (fields and `irVersion`), the gate's rules as tables of breaking and compatible changes per direction, the projection at the baseline's published major, `openEnum`, accept, lock mode, the baseline file's place in version control, and the policy that each future `irVersion` ships a documented in-memory migration from the previous one; - `docs/annotation-guide.md` documenting `openEnum`; - `CHANGELOG.md` gaining entries under `[Unreleased]` for the IR, the gate, `openEnum`, `atlasAccept` and lock mode."
  statement_sha: "sha256:16e0d0962866220f54684793a23e3162e31c706d85088e638eac6f7d89cf9031"
  verifiers:
    - kind: deterministic
      test: "scripts/check-contract-docs.sh"
FR-020:
  statement: "`./gradlew build` MUST pass with Gradle on JDK 17 and, separately, on JDK 21, run by `scripts/build-on-jdk-matrix.sh`."
  statement_sha: "sha256:97a6a5fcba55738fc057a57d8972e17247a307c71386d8adab1dc3e917fbb2e7"
  verifiers:
    - kind: deterministic
      test: "scripts/build-on-jdk-matrix.sh"
